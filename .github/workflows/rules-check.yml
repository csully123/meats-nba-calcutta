name: Firestore rules check
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/rules_check.py
        env:
          POOL_PASSWORD: ${{ secrets.POOL_PASSWORD }}
      - name: Commit result
        run: |
          git config user.name "calcutta-bot"
          git config user.email "calcutta-bot@users.noreply.github.com"
          git add data/probe/rules-check.txt
          git commit -m "Rules check result" || exit 0
          git pull --rebase origin main
          git push
