name: Fetch flag images

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the official flag files from Wikimedia Commons
        run: |
          mkdir -p assets
          ua="meats-nba-calcutta/1.0 (friends picks pool; github.com/csully123/meats-nba-calcutta)"
          curl -fsSL -A "$ua" -o assets/flag-serbia.svg "https://commons.wikimedia.org/wiki/Special:FilePath/Flag_of_Serbia.svg"
          curl -fsSL -A "$ua" -o assets/flag-poland.svg "https://commons.wikimedia.org/wiki/Special:FilePath/Flag_of_Poland.svg"
          curl -fsSL -A "$ua" -o assets/flag-israel.svg "https://commons.wikimedia.org/wiki/Special:FilePath/Flag_of_Israel.svg"
          curl -fsSL -A "$ua" -o assets/flag-italy.svg "https://commons.wikimedia.org/wiki/Special:FilePath/Flag_of_Italy.svg"
          ls -la assets && head -c 300 assets/flag-serbia.svg
      - name: Commit
        run: |
          git config user.name "calcutta-bot"
          git config user.email "calcutta-bot@users.noreply.github.com"
          git add assets
          git commit -m "Add flag images" || echo "nothing to commit"
          git pull --rebase origin main
          git push
