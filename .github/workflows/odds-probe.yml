name: Odds alt-lines probe
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/odds_probe.py
        env: { ODDS_API_KEY: "${{ secrets.ODDS_API_KEY }}" }
      - run: |
          git config user.name calcutta-bot; git config user.email calcutta-bot@users.noreply.github.com
          git add data/odds_alt_sample.json; git commit -m "alt lines sample" || true; git pull --rebase origin main; git push
