name: Reopen voided bets
on:
  workflow_dispatch:
    inputs:
      date:
        description: "Game date (YYYY-MM-DD) whose voided bets go back to open"
        required: true
jobs:
  reopen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/reopen_voids.py "${{ inputs.date }}"
        env:
          POOL_PASSWORD: ${{ secrets.POOL_PASSWORD }}
