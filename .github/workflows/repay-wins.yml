name: Re-pay settled wins
on:
  workflow_dispatch:
jobs:
  repay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/grade.py --repay-only
        env:
          POOL_PASSWORD: ${{ secrets.POOL_PASSWORD }}
